<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Java-ES仿京东搜索</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    .pagination { margin-top: 20px; text-align: center; }
    .pagination button { margin: 0 5px; padding: 5px 10px; }
    .pagination span { margin: 0 10px; }
    .favorite-btn {
      cursor: pointer;
      font-size: 18px;
      margin-left: 10px;
      color: grey;
      display: inline-block;
      vertical-align: middle;
    }
    .favorite-btn.active { color: yellow; }
    .header-extra { position: relative; }
    .favorites-link {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 5px 10px;
      background: #f0f0f0;
      text-decoration: none;
      color: #333;
      border-radius: 3px;
    }
    .favorites-view { display: none; }
    .favorites-view.active { display: block; }
    .productStatus { display: flex; align-items: center; }
    .history-item, .category-item {
      display: inline-block;
      padding: 0px 10px;
      cursor: pointer;
      text-align: center; /* 使列表内容水平居中 */
    }
    .history-item.active, .category-item.active {
      color: #e4393c;
      font-weight: bold;
    }
    .relKeyTop {
      display: block !important; /* 确保历史记录列表可见 */
      margin-top: 5px;
    }
    .fSort-cur {
      color: #e4393c; /* 高亮颜色，与.history-item.active一致 */
      font-weight: bold;
    }
  </style>
</head>

<body class="pg">
<div class="page" id="app">
  <div id="mallPage" class=" mallist tmall- page-not-market ">

    <!-- 头部搜索 -->
    <div id="header" class=" header-list-app">
      <div class="headerLayout">
        <div class="headerCon ">
          <h1 id="mallLogo">
            <img th:src="@{/images/jdlogo.png}" alt="">
          </h1>
          <div class="header-extra">
            <div id="mallSearch" class="mall-search" v-show="!isFavoritesView">
              <form name="searchTop" class="mallSearch-form clearfix">
                <fieldset>
                  <legend>天猫搜索</legend>
                  <div class="mallSearch-input clearfix">
                    <div class="s-combobox" id="s-combobox-685">
                      <div class="s-combobox-input-wrap">
                        <input v-model="keyword" type="text" autocomplete="off" value="" id="mq" class="s-combobox-input" aria-haspopup="true">
                      </div>
                    </div>
                    <button @click.prevent="searchPage" type="submit" id="searchbtn">搜索</button>
                  </div>
                </fieldset>
              </form>
              <ul class="relKeyTop">
                <li v-for="history in searchHistory" :key="history">
                  <a class="history-item"
                     :class="{ 'active': keyword === history }"
                     @click.prevent="searchFromHistory(history)">{{ history }}</a>
                </li>
              </ul>
            </div>
            <a href="#" class="favorites-link" @click.prevent="showFavorites">我的收藏</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div _id="content" v-show="!isFavoritesView">
    <div class="main">
      <form class="navAttrsForm">
        <div class="attrs j_NavAttrs" style="display:block">
          <div class="brandAttr j_nav_brand">
            <div class="j_Brand attr">
              <div class="attrKey">分类</div>
              <div class="attrValues">
                <ul class="av-collapse row-2">
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '理工' }" @click.prevent="searchByType('理工')"> 理工 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '经管与人文' }" @click.prevent="searchByType('经管与人文')"> 经管与人文 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '文化与传播' }" @click.prevent="searchByType('文化与传播')"> 文化与传播 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '法律与艺术' }" @click.prevent="searchByType('法律与艺术')"> 法律与艺术 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '计算机与电子信息' }" @click.prevent="searchByType('计算机与电子信息')"> 计算机与电子信息 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '生物与医学' }" @click.prevent="searchByType('生物与医学')"> 生物与医学 </a></li>
                  <li><a href="#" class="category-item" :class="{ 'active': currentType === '全部' }" @click.prevent="searchByType('全部')"> 全部 </a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </form>

      <div class="filter clearfix">
        <a class="fSort" :class="{ 'fSort-cur': sortOrder === 'asc' }" @click.prevent="sortByPrice('asc')">价格<i class="f-ico-triangle-mt"></i></a>
        <a class="fSort" :class="{ 'fSort-cur': sortOrder === 'desc' }" @click.prevent="sortByPrice('desc')"><i class="f-ico-triangle-mb"></i></a>
      </div>

      <div class="view grid-nosku">
        <div class="product" v-for="item in results" :key="item.isbn">
          <div class="product-iWrap">
            <div class="productImg-wrap">
              <a class="productImg"><img :src="item.img"></a>
            </div>
            <p class="productPrice"><em>{{item.price}}</em></p>
            <p class="productTitle"><a v-html="item.title"></a></p>
            <p class="productType"><span>类型：{{item.type}}</span></p>
            <div class="productShop"><span>店铺： 实践课 </span></div>
            <p class="productStatus">
              <span>月成交<em>999笔</em></span>
              <span>评价 <a>3</a></span>
              <span class="favorite-btn" :class="{ 'active': isFavorited(item.isbn) }" @click="toggleFavorite(item)">★</span>
            </p>
          </div>
        </div>
      </div>

      <div class="pagination">
        <button @click="prevPage" :disabled="currentPage === 1">上一页</button>
        <span>第 {{ currentPage }} 页 / 共 {{ totalPages }} 页 (共 {{ totalItems }} 本书)</span>
        <button @click="nextPage" :disabled="currentPage === totalPages">下一页</button>
      </div>
    </div>
  </div>

  <!-- 收藏界面 -->
  <div id="content" class="favorites-view" :class="{ 'active': isFavoritesView }">
    <div class="main">
      <h2>我的收藏</h2>
      <button @click="backToMain">返回</button>
      <div class="view grid-nosku">
        <div class="product" v-for="item in favorites" :key="item.isbn">
          <div class="product-iWrap">
            <div class="productImg-wrap">
              <a class="productImg"><img :src="item.img"></a>
            </div>
            <p class="productPrice"><em>{{item.price}}</em></p>
            <p class="productTitle"><a v-html="item.title"></a></p>
            <p class="productType"><span>类型：{{item.type}}</span></p>
            <div class="productShop"><span>店铺： 实践课 </span></div>
            <p class="productStatus">
              <span>月成交<em>999笔</em></span>
              <span>评价 <a>3</a></span>
              <span class="favorite-btn active" @click="toggleFavorite(item)">★</span>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>

<script src="./js/vue.min.js"></script>
<script src="./js/axios.min.js"></script>
<script type="text/javascript">
  var vm = new Vue({
    el: '#app',
    data: {
      keyword: "",
      currentType: "全部",
      results: [],
      sortOrder: '',
      currentPage: 1,
      pageSize: 20,
      totalItems: 0,
      totalPages: 0,
      favorites: [],
      isFavoritesView: false,
      searchHistory: [],
      userId: "user123",
      searchTimeout: null // 用于防抖的定时器
    },
    mounted() {
      console.log('Vue mounted, loading initial data...');
      this.loadFavorites();
      this.loadSearchHistoryFromServer();
      this.searchWithParams(this.keyword, this.currentType, this.sortOrder);
    },
    methods: {
      debouncedSearch() {
          // 清除之前的定时器
          if (this.searchTimeout) {
            clearTimeout(this.searchTimeout);
          }
          // 设置新的定时器，300ms后执行搜索
          this.searchTimeout = setTimeout(() => {
            this.searchPage();
          }, 300);
        },
      searchPage() {
        console.log('Search page triggered with keyword:', this.keyword);
        if (this.keyword && this.keyword.trim()) {
          // 先保存搜索历史
          axios.post('http://localhost:8080/saveSearchHistory', null, {
            params: {
              userId: this.userId,
              keyword: this.keyword.trim()
            }
          }).then(() => {
            console.log('Search history saved for keyword:', this.keyword);
            // 保存成功后立即加载最新的历史记录
            this.loadSearchHistoryFromServer();
          }).catch(error => {
            console.error('Error saving search history:', error.response ? error.response.data : error.message);
          });

          // 执行搜索
          this.currentPage = 1;
          this.searchWithParams(this.keyword, this.currentType, this.sortOrder);
        } else {
          console.log('Keyword is empty, skipping save');
        }
      },
      searchFromHistory(history) {
        console.log('Searching from history:', history);
        this.keyword = history;
        this.currentPage = 1;
        this.searchWithParams(history, this.currentType, this.sortOrder);
      },
      searchByType(type) {
        console.log('Search by type triggered with type:', type);
        this.currentType = type;
        this.sortOrder = '';
        this.currentPage = 1;
        this.searchWithParams(this.keyword, type, '');
      },
      sortByPrice(order) {
        console.log('Sort entire ' + this.currentType + ' category by price with order:', order);
        this.sortOrder = order;
        this.currentPage = 1;
        this.searchWithParams(this.keyword, this.currentType, order);
      },
      prevPage() {
        if (this.currentPage > 1) {
          this.currentPage--;
          this.searchWithParams(this.keyword, this.currentType, this.sortOrder);
        }
      },
      nextPage() {
        if (this.currentPage < this.totalPages) {
          this.currentPage++;
          this.searchWithParams(this.keyword, this.currentType, this.sortOrder);
        }
      },
      searchWithParams(keyword, type, sortOrder) {
        console.log('Searching with params:', { keyword, type, sortOrder, pageNo: this.currentPage });
        axios.request({
          method: "POST",
          url: "http://localhost:8080/query",
          params: {
            keyword: keyword,
            pageNo: this.currentPage,
            pageSize: this.pageSize,
            type: type,
            sortOrder: sortOrder
          }
        }).then(response => {
          console.log('Received search response:', response.data);
          this.results = response.data.results;
          this.totalItems = response.data.total;
          this.totalPages = Math.ceil(this.totalItems / this.pageSize);
        }).catch(error => {
          console.error('Error fetching search data:', error.response ? error.response.data : error.message);
        });
      },
      toggleFavorite(item) {
        const isbn = item.isbn;
        const index = this.favorites.findIndex(fav => fav.isbn === isbn);
        if (index === -1) {
          this.favorites.push(item);
          console.log('Added to favorites:', item.title);
        } else {
          this.favorites.splice(index, 1);
          console.log('Removed from favorites:', item.title);
        }
        localStorage.setItem('favorites', JSON.stringify(this.favorites));
      },
      isFavorited(isbn) {
        return this.favorites.some(fav => fav.isbn === isbn);
      },
      loadFavorites() {
        const savedFavorites = localStorage.getItem('favorites');
        if (savedFavorites) {
          this.favorites = JSON.parse(savedFavorites);
          console.log('Loaded favorites:', this.favorites);
        }
      },
      loadSearchHistoryFromServer() {
        console.log('Loading search history for user:', this.userId);
        axios.get('http://localhost:8080/getSearchHistory', {
          params: { userId: this.userId }
        }).then(response => {
          console.log('Raw response from getSearchHistory:', response);
          console.log('Search history response data:', response.data);
          this.searchHistory = response.data.history ? response.data.history.slice(0, 10) : [];
          console.log('Updated searchHistory:', this.searchHistory);
        }).catch(error => {
          console.error('Error loading search history:', error.response ? error.response.data : error.message);
          this.searchHistory = [];
          console.log('Set searchHistory to empty due to error:', this.searchHistory);
        });
      },
      showFavorites() {
        this.isFavoritesView = true;
      },
      backToMain() {
        this.isFavoritesView = false;
      }
    }
  });
</script>
</html>
